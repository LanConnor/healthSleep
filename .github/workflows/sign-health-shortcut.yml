# 在 macOS runner 上用 Apple 的 shortcuts sign 给快捷指令签名。
# 未签名的 .shortcut 无法在 iOS 15+ 导入；签好的文件从 artifact 下载后打开即可。
#
# 触发方式：Actions → Sign iOS Shortcut → Run workflow
# 产物：signed-health-shortcut artifact，内含 health-samples.shortcut
name: Sign iOS Shortcut

on:
  workflow_dispatch:

jobs:
  sign:
    name: Sign health-samples.shortcut
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 从构建脚本重新生成，确保仓库里的源文件与脚本一致
      - name: Build unsigned shortcut
        run: node tools/build-health-shortcut.mjs

      - name: Sign shortcut
        run: |
          set -euo pipefail
          if ! command -v shortcuts >/dev/null 2>&1; then
            echo "::error::当前 runner 没有 shortcuts CLI"
            exit 1
          fi

          mkdir -p dist
          INPUT="shortcuts/health-samples.shortcut"
          OUTPUT="dist/health-samples.shortcut"

          # 先直接签 XML 源文件；失败则转成二进制 plist 再签（与 Shortcuts Playground 的做法一致）
          if shortcuts sign --mode anyone --input "$INPUT" --output "$OUTPUT"; then
            echo "已签名 XML 源文件"
          else
            echo "XML 直接签名失败，改用二进制 plist 重试"
            plutil -lint "$INPUT"
            plutil -convert binary1 "$INPUT" -o "$RUNNER_TEMP/health-samples.shortcut"
            shortcuts sign --mode anyone \
              --input "$RUNNER_TEMP/health-samples.shortcut" \
              --output "$OUTPUT"
          fi

          test -s "$OUTPUT"
          ls -lh "$OUTPUT"
          file "$OUTPUT"

      - name: Upload signed shortcut
        uses: actions/upload-artifact@v4
        with:
          name: signed-health-shortcut
          path: dist/health-samples.shortcut
          if-no-files-found: error
          retention-days: 30
